---
name: "Pylontech RS232 HAOS"
version: "2.0.9"
slug: pylontech_rs232_haos
description: Pylontech US2000C/US3000/US5000/Pelio management via RS232 console or TCP/IP gateway
url: https://github.com/jean-luc1203/Pylontech-rs232-haos
panel_icon: mdi:battery-high
startup: services
boot: auto
init: false
arch:
  - aarch64
  - amd64
ports:
  "1893/tcp": 1893
ports_description:
  "1893/tcp": Node-RED web interface
homeassistant_api: true
uart: true
map:
  - config:rw
  - share:rw

options:
  # Pylontech configuration
  pylontech_path: "/dev/serial/by-id/usb-xxxx_USB_Serial-abcdefghij"
  packs_count: 0
  use_gateway: false
  gateway_ip_port: ""
  communication_debug: false

  # MQTT configuration
  mqttadresse_port: "core-mosquitto:1883"
  mqttuser: ""
  mqttpass: ""
  mqtt_base_topic: "pylontech1"

  # Telemetry
  Send_bip: true

  # ============================================================
  # 👑 PREMIUM
  # ============================================================
  premium_section: "────────── PREMIUM ──────────"
  premium_license: ""

  # ============================================================
  # 🎨 DASHBOARD
  # ============================================================
  dashboard_section: "────────── DASHBOARD ──────────"
  dashboard_language: "fr"

schema:
  pylontech_path: str?
  packs_count: int(0,15)
  use_gateway: bool
  gateway_ip_port: str?
  communication_debug: bool

  mqttadresse_port: str
  mqttuser: str?
  mqttpass: password?
  mqtt_base_topic: str

  Send_bip: bool

  premium_section: str?
  premium_license: str?

  dashboard_section: str?
  dashboard_language: list(fr|en)
