<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Energy Premium - Pylontech</title>
<style>

:root{
  --bg:#050b16;--panel:rgba(7,15,30,.92);--card:rgba(12,23,43,.96);
  --border:rgba(126,161,206,.22);--txt:#edf5ff;--muted:#91a7c4;
  --solar:#ffc928;--load:#20c7ff;--bat:#21df69;--grid:#9b5cff;
  --red:#ff5f7a;--orange:#ff9f43;--blue:#3aa6ff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--txt)}
body{
  background:
    radial-gradient(circle at 20% 0%,rgba(255,201,40,.18),transparent 28%),
    radial-gradient(circle at 88% 0%,rgba(46,199,255,.18),transparent 32%),
    radial-gradient(circle at 50% 110%,rgba(36,224,109,.10),transparent 42%),
    linear-gradient(135deg,#020617,#071326 55%,#03101f);
}
.app{min-height:100vh;padding:10px;display:grid;grid-template-rows:1fr auto;gap:8px}
.shell{display:grid;grid-template-columns:190px 1fr;gap:10px;min-height:calc(100vh - 52px)}
.sidebar{border-radius:22px;background:linear-gradient(180deg,rgba(11,23,43,.98),rgba(6,13,26,.96));border:1px solid var(--border);padding:14px;box-shadow:0 24px 80px rgba(0,0,0,.42)}
.brand{display:flex;gap:10px;align-items:center;font-size:21px;font-weight:1000;line-height:1;margin-bottom:16px}
.brand .bolt{color:var(--solar);font-size:29px}.premium{padding:12px;border-radius:15px;color:#c8ffd9;background:rgba(36,224,109,.12);border:1px solid rgba(36,224,109,.35);font-size:12px;font-weight:900;margin-bottom:18px}
.nav{display:grid;gap:8px}.tab{border:1px solid transparent;background:transparent;color:#b8c7dd;padding:12px;border-radius:14px;text-align:left;font-weight:900;cursor:pointer;font-size:15px}
.tab.active{background:linear-gradient(135deg,rgba(46,199,255,.23),rgba(46,199,255,.08));border-color:rgba(46,199,255,.56);color:#fff}
.side-bottom{position:absolute;bottom:20px;font-size:12px;color:var(--muted)}
.main{min-width:0}.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.left-title{display:flex;gap:10px;align-items:center}.left-title h1{margin:0;font-size:28px;letter-spacing:-1.5px}.premium-pill{padding:8px 13px;border-radius:999px;background:rgba(255,159,67,.16);border:1px solid rgba(255,159,67,.48);color:#ffd7a6;font-weight:1000;font-size:12px}
.statusbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{padding:9px 13px;border-radius:999px;background:rgba(15,25,45,.9);border:1px solid var(--border);font-weight:900;font-size:13px}.ok{color:#baffcf;border-color:rgba(36,224,109,.35);background:rgba(36,224,109,.13)}
.view{display:none}.view.active{display:block}.dash-grid{display:grid;grid-template-columns:minmax(780px,1.38fr) minmax(420px,.62fr);gap:10px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:12px;box-shadow:0 20px 70px rgba(0,0,0,.36);backdrop-filter:blur(14px)}
.title{font-size:18px;font-weight:1000;text-transform:uppercase;letter-spacing:.2px;margin:0 0 10px;display:flex;align-items:center;gap:10px}.live{font-size:11px;color:#7cffad;background:rgba(36,224,109,.14);border:1px solid rgba(36,224,109,.33);padding:4px 8px;border-radius:999px}
.flowbox{position:relative;height:680px;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 54%,rgba(46,199,255,.13),transparent 33%),linear-gradient(180deg,rgba(7,15,29,.86),rgba(5,11,22,.94));border:1px solid rgba(126,161,206,.14)}
.flowbox:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(126,161,206,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(126,161,206,.055) 1px,transparent 1px);background-size:32px 32px;mask-image:radial-gradient(circle at center,black,transparent 82%)}
.node{position:absolute;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;z-index:5;box-shadow:0 18px 50px rgba(0,0,0,.36)}
.node .ico{font-size:25px;margin-bottom:3px}.label{color:var(--muted);font-size:10px;font-weight:1000;text-transform:uppercase;letter-spacing:1.2px}.value{font-size:25px;font-weight:1000;letter-spacing:-1px;margin-top:4px}.small{color:var(--muted);font-size:11px;margin-top:4px}
.solar{border-color:rgba(255,201,40,.55)}.load{border-color:rgba(46,199,255,.55)}.bat{border-color:rgba(36,224,109,.55)}.gridc{border-color:rgba(155,92,255,.55)}.orange{border-color:rgba(255,159,67,.55)}.red{border-color:rgba(255,95,122,.55)}
.mppt{width:205px}.pv-array{width:48px;height:34px;margin-bottom:5px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:4px;border-radius:10px;background:linear-gradient(145deg,#0ea5e9,#1e3a8a 78%);border:1px solid rgba(125,211,252,.75);box-shadow:0 0 24px rgba(56,189,248,.42),inset 0 0 14px rgba(255,255,255,.10);transform:perspective(80px) rotateX(5deg)}.pv-array i{display:block;border-radius:3px;background:linear-gradient(145deg,rgba(224,242,254,.95),rgba(14,165,233,.35));border:1px solid rgba(186,230,253,.35)}.pv-array:after{content:attr(data-n);position:absolute;margin-left:37px;margin-top:-9px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#0f172a;border:1px solid rgba(125,211,252,.75);color:#e0f7ff;font-size:13px;font-weight:1000}.alarm-siren{font-size:42px;filter:drop-shadow(0 0 18px rgba(239,68,68,.55));animation:sirenPulse 1.2s infinite alternate}.alarm-ok{filter:drop-shadow(0 0 18px rgba(34,197,94,.45));opacity:.65;animation:none}.info-tile:before,.diag-wow-card:before{content:attr(data-ico);position:absolute;right:12px;top:8px;font-size:22px;opacity:.28}@keyframes sirenPulse{from{transform:scale(1);opacity:.75}to{transform:scale(1.08);opacity:1}}.left1{left:18px;top:44px}.left2{left:18px;top:180px}.right1{right:18px;top:44px}.right2{right:18px;top:180px}
.solar-total{left:50%;top:16px;transform:translateX(-50%);width:250px;text-align:center}.n-grid{left:18px;top:380px;width:205px}.n-load{right:18px;top:380px;width:220px}.n-bat{left:50%;bottom:8px;transform:translateX(-50%);width:300px;text-align:center}
.inverter-core{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:225px;height:285px;border-radius:50%;background:radial-gradient(circle,rgba(46,199,255,.18),rgba(8,16,31,.95) 68%);border:1px solid rgba(46,199,255,.62);box-shadow:0 0 85px rgba(46,199,255,.20);z-index:4;display:flex;align-items:center;justify-content:center;text-align:center}
.inverter-pic{width:94px;height:84px;margin:0 auto 8px;border-radius:10px;background:linear-gradient(180deg,#d7dde7,#9da7b4);border:1px solid rgba(255,255,255,.38);box-shadow:0 12px 30px rgba(0,0,0,.45);position:relative}
.inverter-pic:before{content:"";position:absolute;left:28px;right:28px;top:18px;height:26px;border-radius:5px;background:#07111f;border:1px solid #64748b}.inverter-pic:after{content:"VOLTRONIC";position:absolute;bottom:8px;left:0;right:0;color:#111827;font-size:7px;font-weight:900}
.screen{position:relative;color:#fff}.main-power{font-size:28px;font-weight:1000;letter-spacing:-1px}.core-extra{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}.core-extra span{padding:5px 6px;border-radius:9px;background:rgba(15,25,45,.82);border:1px solid rgba(46,199,255,.22);font-size:11px;font-weight:900;color:#d9f4ff}.meta{color:#9fb2cc;font-size:11px;margin-top:4px}
svg.flow{position:absolute;inset:0;width:100%;height:100%;z-index:2}.path{fill:none;stroke-width:7;stroke-linecap:round;opacity:.18;filter:drop-shadow(0 0 10px currentColor)}.pvpath{stroke:var(--solar);color:var(--solar)}.loadpath{stroke:var(--load);color:var(--load)}.batpath{stroke:var(--bat);color:var(--bat)}.gridpath{stroke:var(--grid);color:var(--grid);stroke-dasharray:14 16}.dot{fill:currentColor;filter:drop-shadow(0 0 12px currentColor)}
.side-stack{display:grid;gap:10px}.cards2{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cards5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px;box-shadow:0 12px 35px rgba(0,0,0,.25)}.card .value{font-size:22px}
.donut-row{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;align-items:center}.donut-legend{display:grid;gap:10px}.legend-line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid rgba(126,161,206,.10);padding-bottom:7px}.dot-legend{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px}.donut{width:160px;height:160px;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;box-shadow:0 0 45px rgba(46,199,255,.13)}.donut-inner{width:103px;height:103px;border-radius:50%;background:#0f172a;display:flex;align-items:center;justify-content:center;text-align:center}
.gauge-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.gauge{height:95px;border-radius:120px 120px 0 0;background:conic-gradient(from 270deg,var(--bat) 0 50%,#1e293b 50% 100%);position:relative;overflow:hidden}.gauge:after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:58%;background:#0f172a;border-radius:120px 120px 0 0}.gauge-label{position:absolute;left:0;right:0;bottom:8px;text-align:center;z-index:2}.mini-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.energy-area{display:grid;grid-template-columns:1.15fr .85fr;gap:10px;margin-top:10px}.periods{display:flex;gap:8px;margin-bottom:8px}.period{padding:7px 12px;border-radius:8px;background:#0f172a;border:1px solid var(--border);color:#cbd5e1;font-weight:900;cursor:pointer}.period.active{background:rgba(46,199,255,.18);border-color:rgba(46,199,255,.55)}
.chart{height:205px;border-radius:14px;background:linear-gradient(rgba(120,150,190,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(120,150,190,.06) 1px,transparent 1px),#0b1220;background-size:100% 40px,50px 100%;padding:12px;position:relative}.bar{height:12px;background:#1e293b;border-radius:999px;overflow:hidden;margin-top:6px}.activity{display:grid;gap:8px}.activity-row{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;background:rgba(15,25,45,.72);border:1px solid rgba(126,161,206,.12);border-radius:11px;padding:8px}.activity-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,201,40,.12)}
.footer{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;padding:0 18px}.cmd{border:0;border-radius:14px;padding:10px 13px;font-weight:900;color:white;background:rgba(46,199,255,.24);cursor:pointer;margin:4px}.cmd:hover{background:rgba(46,199,255,.45)}

.bms-pack{background:linear-gradient(180deg,rgba(15,25,45,.96),rgba(7,14,28,.95));border:1px solid var(--border);border-radius:20px;padding:14px;box-shadow:0 14px 45px rgba(0,0,0,.28)}
.bms-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.bms-title{font-size:20px;font-weight:1000;letter-spacing:-.5px}
.bms-pill{padding:6px 10px;border-radius:999px;background:rgba(36,224,109,.13);border:1px solid rgba(36,224,109,.35);color:#baffcf;font-size:12px;font-weight:900}
.bms-top{display:grid;grid-template-columns:180px 1fr;gap:14px;align-items:center}
.soc-ring{width:170px;height:170px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:auto;background:conic-gradient(var(--bat) 0 75%,#1e293b 75% 100%);box-shadow:0 0 45px rgba(36,224,109,.14)}
.soc-ring-inner{width:112px;height:112px;border-radius:50%;background:#0f172a;display:flex;align-items:center;justify-content:center;text-align:center}
.bms-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.bms-mini{background:rgba(15,25,45,.78);border:1px solid rgba(126,161,206,.14);border-radius:14px;padding:10px}
.bms-mini .label{font-size:10px}.bms-mini .value{font-size:22px}
.cell-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.temp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}

/* ===== JK-BMS V2 VISUEL ===== */
.bms-wall{
  display:grid;
  grid-template-columns:repeat(2,minmax(420px,1fr));
  gap:14px;
}
.bms-pack{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 15% 0%,rgba(36,224,109,.18),transparent 32%),
    radial-gradient(circle at 90% 10%,rgba(46,199,255,.12),transparent 36%),
    linear-gradient(180deg,rgba(14,27,50,.98),rgba(5,12,25,.96));
  border:1px solid rgba(126,161,206,.22);
  border-radius:22px;
  padding:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.34);
}
.bms-pack:before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(126,161,206,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(126,161,206,.045) 1px,transparent 1px);
  background-size:28px 28px;
  pointer-events:none;
}
.bms-head{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}
.bms-title{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:22px;
  font-weight:1000;
  letter-spacing:-.6px;
}
.bms-title-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(36,224,109,.16);
  border:1px solid rgba(36,224,109,.35);
  box-shadow:0 0 24px rgba(36,224,109,.12);
}
.bms-pill{
  padding:7px 11px;
  border-radius:999px;
  background:rgba(36,224,109,.13);
  border:1px solid rgba(36,224,109,.38);
  color:#baffcf;
  font-size:12px;
  font-weight:900;
}
.bms-body{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:185px 1fr;
  gap:14px;
  align-items:center;
}
.soc-ring{
  width:170px;
  height:170px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:conic-gradient(var(--bat) 0 75%,#182335 75% 100%);
  box-shadow:0 0 45px rgba(36,224,109,.16);
}
.soc-ring-inner{
  width:113px;
  height:113px;
  border-radius:50%;
  background:#0b1424;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px solid rgba(126,161,206,.16);
}
.soc-ring-inner .value{
  font-size:33px;
}
.bms-main-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}
.bms-kpi{
  background:rgba(9,18,34,.76);
  border:1px solid rgba(126,161,206,.16);
  border-radius:15px;
  padding:10px;
  min-height:82px;
}
.bms-kpi .label{font-size:10px}
.bms-kpi .value{font-size:23px}
.bms-kpi .small{font-size:11px}
.sv-scale-bar{position:relative;height:8px;border-radius:999px;background:rgba(30,41,59,.95);overflow:hidden;margin-top:8px;border:1px solid rgba(126,161,206,.14)}
.sv-scale-fill{position:absolute;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,rgba(34,197,94,.85),rgba(46,199,255,.85));box-shadow:0 0 14px rgba(46,199,255,.22)}
.sv-scale-zero{position:absolute;top:-2px;bottom:-2px;width:2px;background:rgba(255,255,255,.42);box-shadow:0 0 8px rgba(255,255,255,.25)}
.sv-soc-wrap{display:grid;gap:8px;justify-items:center}
.sv-soc-wrap .sv-scale-bar{width:155px;max-width:90%;margin-top:0}
.bms-positive{border-color:rgba(36,224,109,.42)}
.bms-negative{border-color:rgba(255,95,122,.42)}
.bms-warn{border-color:rgba(255,159,67,.44)}
.bms-blue{border-color:rgba(46,199,255,.42)}
.bms-cells{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:12px;
}
.cell-card{
  background:rgba(9,18,34,.72);
  border:1px solid rgba(126,161,206,.14);
  border-radius:14px;
  padding:9px;
}
.cell-card .value{font-size:21px}
.bms-temp-strip{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-top:10px;
}
.temp-chip{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  background:rgba(255,159,67,.09);
  border:1px solid rgba(255,159,67,.25);
  border-radius:12px;
  padding:8px 9px;
  font-weight:900;
}
.temp-chip span{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.5px;
}
.temp-chip b{
  font-size:15px;
}
.bms-alert{
  position:relative;
  z-index:1;
  margin-top:10px;
  padding:9px 10px;
  border-radius:13px;
  background:rgba(46,199,255,.08);
  border:1px solid rgba(46,199,255,.20);
  color:#cfeeff;
  font-size:12px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}
@media(max-width:1200px){
  .bms-wall,.bms-body,.bms-main-grid,.bms-cells,.bms-temp-strip{grid-template-columns:1fr}
  .soc-ring{margin:auto}
}

@media(max-width:1200px){.bms-top,.bms-metrics,.cell-grid,.temp-grid{grid-template-columns:1fr}.soc-ring{width:150px;height:150px}}

@media(max-width:1200px){.shell,.dash-grid,.energy-area,.cards4,.cards5,.cards3,.cards2,.donut-row,.gauge-row{grid-template-columns:1fr}.sidebar{min-height:auto}.flowbox{height:auto;min-height:900px;padding:12px}.node,.mppt,.solar-total,.n-grid,.n-load,.n-bat,.inverter-core{position:relative;left:auto;right:auto;top:auto;bottom:auto;transform:none;width:auto;margin:10px}svg.flow{display:none}}


/* ===== DYNAMIC HTML DASHBOARD V12 ===== */
.clickable{cursor:pointer;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.clickable:hover{transform:translateY(-2px);border-color:rgba(46,199,255,.7);box-shadow:0 18px 50px rgba(46,199,255,.16)}
.dynamic-note{padding:10px 12px;border-radius:14px;background:rgba(46,199,255,.09);border:1px solid rgba(46,199,255,.24);color:#cfeeff;font-size:12px;margin-bottom:10px}

function computedBank(){
  const ids=getPackIds();
  const socVals=ids.map(i=>pNum(i,'soc')).filter(Number.isFinite);
  const voltVals=ids.map(i=>pNum(i,'voltage')).filter(Number.isFinite);
  const currentVals=ids.map(i=>pNum(i,'current')).filter(Number.isFinite);
  const powerVals=ids.map(i=>pNum(i,'power')).filter(Number.isFinite);
  const deltaVals=ids.map(i=>{let mv=pNum(i,'cell_delta_mv'); if(Number.isFinite(mv))return mv; let v=pNum(i,'cell_delta_v'); return Number.isFinite(v)?v*1000:NaN}).filter(Number.isFinite);
  return {
    packs:ids.length,
    online:Number.isFinite(bankNum('packs_online'))?bankNum('packs_online'):ids.filter(packHasData).length,
    soc:Number.isFinite(bankNum('soc_avg'))?bankNum('soc_avg'):(socVals.length?socVals.reduce((a,b)=>a+b,0)/socVals.length:NaN),
    voltage:Number.isFinite(bankNum('voltage_avg'))?bankNum('voltage_avg'):(voltVals.length?voltVals.reduce((a,b)=>a+b,0)/voltVals.length:NaN),
    current:Number.isFinite(bankNum('current_total'))?bankNum('current_total'):(currentVals.length?currentVals.reduce((a,b)=>a+b,0):NaN),
    power:Number.isFinite(bankNum('power_total'))?bankNum('power_total'):(powerVals.length?powerVals.reduce((a,b)=>a+b,0):NaN),
    socMin:Number.isFinite(bankNum('soc_min'))?bankNum('soc_min'):(socVals.length?Math.min(...socVals):NaN),
    socMax:Number.isFinite(bankNum('soc_max'))?bankNum('soc_max'):(socVals.length?Math.max(...socVals):NaN),
    deltaMax:deltaVals.length?Math.max(...deltaVals):NaN,
    state:bankState('state','--'),
  };
}

  const sig=JSON.stringify({ids,view:PYLON_VIEW,tab:PYLON_DETAIL_TAB[PYLON_VIEW],states:Object.keys(STATES).length,last:Object.values(STATES).slice(0,10).map(s=>s.state).join('|')});
  if(!force&&sig===RENDER_SIG)return; RENDER_SIG=sig;
  renderSubnav(ids); renderSummary();
  let html=PYLON_VIEW==='overview'?renderOverview(ids):(PYLON_VIEW==='diagnostic'?renderDiagnostic(ids):renderPackDetail(Number(PYLON_VIEW)));
  $('bms_cards').innerHTML=html;
}
function showTab(id,btn){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(id)?.classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));btn?.classList.add('active')}
function copyEntityId(entityId){
  try{
    navigator.clipboard?.writeText(entityId);
  }catch(e){}
}
function isNumericEntityState(st){
  if(!st || bad(st.state))return false;
  const n=Number(String(st.state).replace(',','.'));
  return Number.isFinite(n);
}
function entityHeaderHtml(entityId,st){
  const friendly=st?.attributes?.friendly_name || entityId;
  const unit=st?.attributes?.unit_of_measurement || '';
  return `<div class="pylon-entity-box"><div class="pylon-entity-label">Entity ID</div><div class="pylon-entity-id">${esc(entityId)}</div><div class="pylon-entity-actions"><button class="pylon-entity-copy" onclick="copyEntityId('${esc(entityId)}')">Copier l’ID</button></div></div><div class="cards2">${card('État actuel',esc(st?.state??'--'),esc(unit),'bat',entityId)}${card('Dernière mise à jour',esc(st?.last_changed?new Date(st.last_changed).toLocaleString():'--'),'','blue',entityId)}</div>`;
}
function historyTimeLabel(ts){
  const d=new Date(ts);
  if(!Number.isFinite(d.getTime()))return '';
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
function niceNum(v,d=2){
  v=Number(v);
  if(!Number.isFinite(v))return '--';
  if(Math.abs(v)>=100)return String(Math.round(v));
  if(Math.abs(v)>=10)return v.toFixed(1);
  return v.toFixed(d);
}
function renderHistorySvg(points,unit){
  const w=980,h=360,padL=58,padR=18,padT=20,padB=42;
  if(!points || points.length<2)return `<div class="history-error">Pas assez de points d’historique pour tracer un graphique.</div>`;
  const xs=points.map(p=>p.t), ys=points.map(p=>p.v);
  let minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  if(minY===maxY){minY-=1;maxY+=1}
  const yPad=(maxY-minY)*0.08; minY-=yPad; maxY+=yPad;
  const xScale=t=>padL+(t-minX)/(maxX-minX)*(w-padL-padR);
  const yScale=v=>padT+(maxY-v)/(maxY-minY)*(h-padT-padB);
  const line=points.map((p,i)=>`${i?'L':'M'}${xScale(p.t).toFixed(1)},${yScale(p.v).toFixed(1)}`).join(' ');
  const area=`M${xScale(points[0].t).toFixed(1)},${h-padB} `+points.map(p=>`L${xScale(p.t).toFixed(1)},${yScale(p.v).toFixed(1)}`).join(' ')+` L${xScale(points[points.length-1].t).toFixed(1)},${h-padB} Z`;
  let grids='', labels='';
  for(let i=0;i<=4;i++){
    const y=padT+i*(h-padT-padB)/4;
    const val=maxY-i*(maxY-minY)/4;
    grids+=`<line class="history-grid-line" x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}"/>`;
    labels+=`<text class="history-label" x="8" y="${(y+4).toFixed(1)}">${niceNum(val)}${unit?' '+esc(unit):''}</text>`;
  }
  const tickIdx=[0,Math.floor(points.length/2),points.length-1];
  for(const idx of tickIdx){
    const p=points[idx]; if(!p)continue;
    labels+=`<text class="history-label" text-anchor="middle" x="${xScale(p.t).toFixed(1)}" y="${h-14}">${historyTimeLabel(p.t)}</text>`;
  }
  const last=points[points.length-1];
  const dot=`<circle class="history-dot" cx="${xScale(last.t).toFixed(1)}" cy="${yScale(last.v).toFixed(1)}" r="5"/>`;
  return `<svg class="history-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img">${grids}<line class="history-axis" x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}"/><line class="history-axis" x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}"/><path class="history-area" d="${area}"/><path class="history-line" d="${line}"/>${dot}${labels}</svg>`;
}
function normalizeHistoryPayload(payload,entityId){
  let arr=[];
  if(Array.isArray(payload)){
    if(Array.isArray(payload[0])) arr=payload.find(x=>Array.isArray(x)&&(!x[0]||x[0].entity_id===entityId)) || payload[0] || [];
    else arr=payload;
  }
  const points=[];
  for(const row of arr){
    const raw=row?.state;
    const n=Number(String(raw).replace(',','.'));
    const ts=Date.parse(row?.last_changed || row?.last_updated || row?.lu || row?.last_reported || '');
    if(Number.isFinite(n)&&Number.isFinite(ts))points.push({t:ts,v:n});
  }
  points.sort((a,b)=>a.t-b.t);
  const filtered=[];
  for(const p of points){
    const prev=filtered[filtered.length-1];
    if(!prev || Math.abs(prev.v-p.v)>1e-9 || (p.t-prev.t)>30*60*1000)filtered.push(p);
  }
  return filtered.slice(-500);
}
async function fetchHistoryPoints(entityId,hours=24){
  const start=new Date(Date.now()-hours*3600*1000).toISOString();
  const apiPath=`history/period/${encodeURIComponent(start)}?filter_entity_id=${encodeURIComponent(entityId)}`;
  const ha=getParentHassObject();
  if(ha && typeof ha.callApi==='function'){
    const payload=await ha.callApi('GET',apiPath);
    return normalizeHistoryPayload(payload,entityId);
  }
  const token=tokenFromStorage();
  const url=`/api/${apiPath}`;
  const headers={};
  if(token)headers.Authorization=`Bearer ${token}`;
  const res=await fetch(url,{cache:'no-store',headers});
  if(!res.ok)throw new Error('Historique indisponible');
  const payload=await res.json();
  return normalizeHistoryPayload(payload,entityId);
}
async function loadNumericHistory(entityId,st){
  const unit=st?.attributes?.unit_of_measurement || '';
  const chart=$('history_chart');
  if(!chart)return;
  chart.innerHTML='<div class="history-loading">Chargement de l’historique 24h...</div>';
  try{
    const points=await fetchHistoryPoints(entityId,24);
    const min=points.length?Math.min(...points.map(p=>p.v)):NaN;
    const max=points.length?Math.max(...points.map(p=>p.v)):NaN;
    chart.innerHTML=`<div class="history-chart-head"><div class="history-chart-title">Historique 24h</div><div class="history-chart-meta">${points.length} points · min ${niceNum(min)}${unit?' '+esc(unit):''} · max ${niceNum(max)}${unit?' '+esc(unit):''}</div></div>${renderHistorySvg(points,unit)}`;
  }catch(e){
    chart.innerHTML=`<div class="history-error">Impossible de charger l’historique depuis Home Assistant.<br><span class="small">${esc(e?.message||e)}</span></div>`;
  }
}
function moreInfo(entityId){
  if(!entityId)return;

  $('history_modal').classList.add('open');
  if(numeric)loadNumericHistory(entityId,st);
}
function closeMiniHistory(){$('history_modal')?.classList.remove('open')}
function safeTry(fn){try{return fn()}catch(e){return null}}
function deepFindHass(node,depth=0){
  if(!node||depth>6)return null;
  try{if(node.hass&&node.hass.states)return node.hass}catch(e){}
  try{if(node.host&&node.host.hass&&node.host.hass.states)return node.host.hass}catch(e){}
  let kids=[];
  try{if(node.children)kids=kids.concat(Array.from(node.children))}catch(e){}
  try{if(node.shadowRoot)kids.push(node.shadowRoot)}catch(e){}
  for(const k of kids){const h=deepFindHass(k,depth+1);if(h)return h}
  return null;
}
function allReachableWindows(){
  const out=[], seen=new Set();
  let w=window;
  for(let i=0;i<8;i++){
    try{if(w&&!seen.has(w)){seen.add(w);out.push(w)}}catch(e){}
    try{if(!w||w.parent===w)break;w=w.parent}catch(e){break}
  }
  try{if(window.top&&!seen.has(window.top)){seen.add(window.top);out.push(window.top)}}catch(e){}
  try{if(window.opener&&!seen.has(window.opener)){seen.add(window.opener);out.push(window.opener)}}catch(e){}
  return out;
}
function getParentHassObject(){
  for(const w of allReachableWindows()){
    const candidates=[
      ()=>w.hass,
      ()=>w.__hass,
      ()=>w.document?.querySelector?.('home-assistant')?.hass,
      ()=>w.document?.querySelector?.('home-assistant-main')?.hass,
      ()=>w.document?.querySelector?.('ha-panel-lovelace')?.hass,
      ()=>w.document?.querySelector?.('hui-root')?.hass,
      ()=>deepFindHass(w.document)
    ];
    for(const fn of candidates){
      const h=safeTry(fn);
      if(h&&(h.states||h.callWS||h.connection))return h;
    }
  }
  return null;
}
let HASS_CALLWS_PENDING=false;
function applyStateList(list){
  if(Array.isArray(list)){
    STATES={};
    list.forEach(s=>{if(s&&s.entity_id)STATES[s.entity_id]=s});
    renderDashboard(true);
    return true;
  }
  return false;
}
function loadFromParentHass(){
  const h=getParentHassObject();
  if(!h)return false;
  if(h.states&&Object.keys(h.states).length){
    STATES=h.states;
    renderDashboard();
    return true;
  }
  if(h.callWS&&!HASS_CALLWS_PENDING){
    HASS_CALLWS_PENDING=true;
    h.callWS({type:'get_states'}).then(applyStateList).catch(()=>{}).finally(()=>{HASS_CALLWS_PENDING=false});
  }
  return false;
}
function findAccessToken(obj,depth=0){
  if(!obj||depth>7)return null;
  if(typeof obj==='string'){const t=obj.trim(); if(t.length>40&&(t.startsWith('eyJ')||t.split('.').length>=2))return t; return null}
  if(typeof obj!=='object')return null;
  for(const k of ['access_token','accessToken','token','llat'])if(typeof obj[k]==='string'&&obj[k].length>30)return obj[k];
  for(const v of Object.values(obj)){const f=findAccessToken(v,depth+1); if(f)return f}
  return null;
}
function tokenFromHassObject(){
  const h=getParentHassObject();
  return findAccessToken(h?.connection?.options?.auth)||findAccessToken(h?.connection)||findAccessToken(h?.auth)||null;
}
function tokenFromStorage(){
  const wins=allReachableWindows();
  for(const w of wins){
    for(const storeName of ['localStorage','sessionStorage']){
      try{
        const store=w[storeName];
        if(!store)continue;
        for(const k of ['hassTokens','tokens','auth','authTokens','homeAssistant']){
          const raw=store.getItem(k);
          if(!raw)continue;
          const f=findAccessToken(JSON.parse(raw));
          if(f)return f;
        }
        const f=findAccessToken(store);
        if(f)return f;
      }catch(e){}
    }
  }
  return tokenFromHassObject();
}
function connectWs(){
  if(WS&&WS.readyState===WebSocket.OPEN)return;
  if(loadFromParentHass())return;
  const token=tokenFromStorage(); if(!token)return;
  const proto=location.protocol==='https:'?'wss':'ws';
  const url=`${proto}://${location.host}/api/websocket`;
  try{
    WS=new WebSocket(url); let id=1;
    WS.onmessage=ev=>{
      const msg=JSON.parse(ev.data);
      if(msg.type==='auth_required')WS.send(JSON.stringify({type:'auth',access_token:token}));
      if(msg.type==='auth_ok'){WS.send(JSON.stringify({id:id++,type:'get_states'}));WS.send(JSON.stringify({id:id++,type:'subscribe_events',event_type:'state_changed'}));}
      if(msg.type==='result'&&Array.isArray(msg.result)){STATES={}; msg.result.forEach(s=>STATES[s.entity_id]=s); renderDashboard(true);}
      if(msg.type==='event'&&msg.event?.event_type==='state_changed'){const ns=msg.event.data?.new_state; if(ns){STATES[ns.entity_id]=ns; renderDashboard();}}
    };
  }catch(e){}
}
function tick(){loadFromParentHass(); connectWs(); renderDashboard();}
setInterval(tick,1500);
window.addEventListener('DOMContentLoaded',()=>{tick();renderDashboard(true)});
setTimeout(()=>renderDashboard(true),100);
</script>
